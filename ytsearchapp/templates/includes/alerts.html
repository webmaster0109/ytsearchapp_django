{% if messages %}
<div class="alert-stack" aria-live="polite">
  {% for message in messages %}
  <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}" role="alert">
    <span>{{ message }}</span>
  </div>
  {% endfor %}
</div>
{% endif %}
