{% extends "base.html" %}

{% block content %}

<div class="container">
    <div class="row">
        <div class="col-12 col-lg-3 col-md-3"></div>
        <div class="col-12 col-lg-6 col-md-6">
            {% include 'logo.html' %}
        </div>
        <div class="col-12 col-lg-3 col-md-3"></div>
    </div>
    <div class="row">
        <div class="col-12 col-lg-3 col-md-3"></div>
        <div class="col-12 col-lg-6 col-md-6">
            <div class="row justify-content-center">
                <div class="card border border-light-subtle rounded-4">
                        <div class="card-body p-3 p-md-4 p-xl-5">
                          <div class="row">
                            <div class="col-12">
                              <div class="mb-5">
                                <h4 class="text-center">Welcome back!</h4>
                              </div>
                            </div>
                          </div>
                          {% include 'includes/alerts.html' %}
                          <form action="{% url 'login' %}" method="post">
                            {% csrf_token %}
                            <input type="hidden" name="next" value="{{ next }}">
                            <div class="row gy-3 overflow-hidden">
                              <div class="col-12">
                                <div class="form-floating mb-3">
                                  <input type="text" class="form-control" name="username" id="username" placeholder="Username" required>
                                  <label for="username" class="form-label">Username</label>
                                </div>
                              </div>
                              <div class="col-12">
                                <div class="form-floating mb-3">
                                  <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
                                  <label for="password" class="form-label">Password</label>
                                </div>
                              </div>
                              <div class="col-12">
                                <div class="d-grid">
                                  <button class="btn bsb-btn-xl btn-dark" type="submit">Log in</button>
                                </div>
                              </div>
                            </div>
                          </form>
                          <div class="row">
                            <div class="col-12">
                              <hr class="mt-5 mb-4 border-secondary-subtle">
                              <div class="d-flex gap-2 gap-md-4 flex-column flex-md-row justify-content-md-end">
                                <a href="{% url 'register' %}" class="link-secondary text-decoration-none">Create new account</a>
                                <a href="{% url 'forgot_password' %}" class="link-secondary text-decoration-none">Forgot password</a>
                                <a href="{% url 'login' %}#resend-verification" class="link-secondary text-decoration-none">Resend verification</a>
                              </div>
                            </div>
                          </div>
                        </div>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-3 col-md-3"></div>
    </div>
</div>
<div id="resend-verification" class="container mb-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-6">
      <form action="{% url 'resend_verification' %}" method="post" class="card card-body">
        {% csrf_token %}
        <label for="verification-identifier" class="form-label text-dark">Username or email for a new verification link</label>
        <div class="input-group">
          <input id="verification-identifier" name="identifier" type="text" class="form-control" required>
          <button class="btn btn-secondary" type="submit">Resend</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
